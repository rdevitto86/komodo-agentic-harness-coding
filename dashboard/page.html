<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Komodo</title>
  <script type="module" src="/assets/datastar.js"></script>
  <style>
    /*css*/
  </style>
</head>

<body data-init="@get('/events'+location.search)">
  <main>
    <header class="top">
      <div class="brand"><span class="logo"></span>Komodo<small>runs</small></div>
      <div id="runhead"></div>
    </header>
    <div id="kpis" class="kpis"></div>
    <section class="card">
      <h2>Pipeline</h2>
      <svg id="pipeline" viewBox="0 0 640 {{.Height}}" role="img"
        aria-label="Stage pipeline with a live count per stage">
        {{range $i, $b := .Boxes}}{{if $i}}
        <line class="flow" x1="{{$b.Prev}}" y1="54" x2="{{$b.X}}" y2="54" />{{end}}{{end}}
        <g id="diagram">{{template "stages" .Boxes}}<g id="pointers"></g>
        </g>
      </svg>
    </section>
    <div class="cols">
      <section>
        <h2 class="h">Groups</h2>
        <div id="groups"></div>
      </section>
      <aside>
        <section class="card">
          <h2>Events</h2>
          <div id="events"></div>
        </section>
        <section class="card">
          <h2>Plan windows</h2>
          <div id="resources"></div>
        </section>
        <section class="card">
          <h2>Agent models</h2>
          <div class="models">
            {{range .Agents}}<label>{{.}} <select data-bind="{{.}}"
                data-on:change="@post('/agents/{{.}}/model'+location.search)">{{range $.Models}}<option>{{.}}</option>
                {{end}}</select></label>
            {{end}}</div>
          <p id="log" class="muted">{{.Actions}} actions</p>
        </section>
      </aside>
    </div>
  </main>
</body>

</html>

{{define "stages"}}<g id="stages">{{range .}}<g class="stage{{if .Count}} on{{end}}">
    <rect x="{{.X}}" y="8" width="88" height="92" rx="12" />
    <text class="stage-label" x="{{.Mid}}" y="32">{{.Title}}</text><text class="stage-count" x="{{.Mid}}" y="82"
      id="count-{{.Key}}">{{.Count}}</text>
  </g>{{end}}</g>{{end}}
